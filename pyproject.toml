[project]
name = "anythingai-telegram"
version = "0.1.0"
description = "Telegram-бот для общения с LLM через OpenAI/Anthropic-совместимые API"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20",
    "anthropic>=0.45",
    "openai>=1.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "BLE", "ARG", "SIM", "ASYNC", "S", "RUF", "PL", "PT", "RET"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "ARG"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
